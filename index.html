/* âââââââââââââââââââââââââââââ RESET & BASE âââââââââââââââââââââââââ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:    #1B2E4B;
  --teal:    #0E7C86;
  --teal-lt: #D0EEF0;
  --gold:    #C8902A;
  --gold-lt: #FFF3DC;
  --green:   #27AE60;
  --red:     #C0392B;
  --amber:   #E67E22;
  --gray-0:  #F4F5F7;
  --gray-1:  #E8EAED;
  --gray-2:  #D0D3DA;
  --gray-3:  #9EA4B0;
  --gray-4:  #4A4F5C;
  --text:    #1a2332;
  --white:   #FFFFFF;
}
html { scroll-behavior: smooth; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #F0F2F5; color: var(--text); font-size: 15px; line-height: 1.6; }

/* âââââââââââââââââââââââââââââ NAV âââââââââââââââââââââââââââââââââ */
nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--navy); padding: 0 32px;
  display: flex; align-items: center; gap: 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  overflow-x: auto; white-space: nowrap;
}
.nav-brand { color: white; font-weight: 800; font-size: 13px; padding: 16px 20px 16px 0; border-right: 1px solid rgba(255,255,255,0.15); margin-right: 8px; letter-spacing: 0.5px; flex-shrink: 0; }
nav a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 12px; font-weight: 600; padding: 18px 14px; transition: color 0.15s, border-color 0.15s; border-bottom: 3px solid transparent; flex-shrink: 0; }
nav a:hover { color: white; border-bottom-color: var(--teal); }
nav a.active { color: white; border-bottom-color: var(--gold); }

/* âââââââââââââââââââââââââââââ HERO âââââââââââââââââââââââââââââââââ */
.hero {
  background: linear-gradient(135deg, var(--navy) 0%, #0E4B6E 60%, var(--teal) 100%);
  color: white; padding: 72px 40px 64px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; top: -60px; right: -80px;
  width: 500px; height: 500px;
  background: rgba(14,124,134,0.15);
  border-radius: 50%;
}
.hero-inner { max-width: 1100px; margin: 0 auto; position: relative; }
.hero-tag { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 12px; }
.hero h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 800; line-height: 1.15; margin-bottom: 8px; }
.hero h1 span { color: #6EE4EC; }
.hero-sub { font-size: 16px; color: rgba(255,255,255,0.75); margin-bottom: 48px; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
.kpi {
  background: rgba(255,255,255,0.1); backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px; padding: 20px 16px; text-align: center;
  transition: background 0.2s;
}
.kpi:hover { background: rgba(255,255,255,0.16); }
.kpi-val { font-size: 36px; font-weight: 900; line-height: 1; color: #6EE4EC; }
.kpi-label { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 6px; line-height: 1.3; }

/* âââââââââââââââââââââââââââââ LAYOUT âââââââââââââââââââââââââââââââ */
.page { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

section { margin-bottom: 56px; scroll-margin-top: 60px; }
.section-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
.section-number { font-size: 11px; font-weight: 800; color: var(--teal); text-transform: uppercase; letter-spacing: 1px; background: var(--teal-lt); padding: 3px 10px; border-radius: 999px; flex-shrink: 0; }
.section-title { font-size: 22px; font-weight: 800; color: var(--navy); }

/* âââââââââââââââââââââââââââââ CARDS ââââââââââââââââââââââââââââââââ */
.card { background: white; border-radius: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); overflow: hidden; }
.card-header { padding: 16px 20px; border-bottom: 1px solid var(--gray-1); font-weight: 700; font-size: 14px; color: var(--navy); display: flex; align-items: center; gap: 8px; }
.card-body { padding: 20px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* âââââââââââââââââââââââââââââ STAT CHIPS âââââââââââââââââââââââââââ */
.stat-row { display: flex; flex-direction: column; gap: 10px; }
.stat-bar { display: flex; align-items: center; gap: 10px; }
.stat-bar-label { font-size: 13px; color: var(--gray-4); width: 180px; flex-shrink: 0; line-height: 1.3; }
.stat-bar-track { flex: 1; background: var(--gray-1); border-radius: 999px; height: 10px; position: relative; }
.stat-bar-fill { height: 100%; border-radius: 999px; transition: width 0.8s ease; }
.stat-bar-pct { font-size: 13px; font-weight: 700; color: var(--navy); width: 36px; text-align: right; flex-shrink: 0; }
